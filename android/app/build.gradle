/*
 * android/app/build.gradle   (Groovy syntax)
 * If you keep this file, delete android/app/build.gradle.kts
 */
plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'dev.flutter.flutter-gradle-plugin'
    id 'com.google.gms.google-services'
}

android {
    namespace "com.fitly.findptapp"
    compileSdk flutter.compileSdkVersion       // from Flutter.gradle
    ndkVersion flutter.ndkVersion

    /* ───────── Java / desugaring ───────── */
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
        // enable core-library desugaring (required by flutter_local_notifications)
        coreLibraryDesugaringEnabled true
    }
    kotlinOptions { jvmTarget = '11' }

    defaultConfig {
        applicationId "com.fitly.findptapp"
        minSdk 23                // ≥21 needed for desugaring
        targetSdk flutter.targetSdkVersion
        versionCode flutter.versionCode
        versionName flutter.versionName
    }

    signingConfigs {
        release {
            storeFile     file("my_release.keystore")
            storePassword "fitly1612"
            keyAlias      "mykey"
            keyPassword   "fitly1612"
        }
    }

    buildTypes {
        debug  { signingConfig signingConfigs.debug }
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'),
                          'proguard-rules.pro'
        }
    }
}

flutter { source '../..' }

dependencies {
    /* Align all Firebase libs with the BoM */
    implementation platform('com.google.firebase:firebase-bom:32.7.0')

    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-appcheck-playintegrity'
    implementation 'com.google.firebase:firebase-messaging'

    /* ─── Desugaring library ─── */
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
}