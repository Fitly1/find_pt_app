/*
 * android/app/build.gradle   (Groovy)
 * Keep this file; delete android/app/build.gradle.kts if it exists.
 */
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'          // Kotlin 2.1.x (declared in settings.gradle)
    id 'dev.flutter.flutter-gradle-plugin'
    id 'com.google.gms.google-services'        // if you use Firebase
}

android {
    namespace "com.fitly.findptapp"

    // Use Flutter's compile/target SDKs from flutter.gradle
    compileSdk flutter.compileSdkVersion

    // Pin NDK r28 for 16 KB page-size compatibility
    ndkVersion "28.0.12433566"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        // Desugaring (needed by libs like flutter_local_notifications)
        coreLibraryDesugaringEnabled true
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        applicationId "com.fitly.findptapp"
        minSdkVersion flutter.minSdkVersion
        targetSdk flutter.targetSdkVersion
        versionCode flutter.versionCode
        versionName flutter.versionName
        multiDexEnabled true
    }

    signingConfigs {
        release {
            // ⚠️ Consider moving secrets out of VCS later
            storeFile     file("my_release.keystore")
            storePassword "fitly1612"
            keyAlias      "mykey"
            keyPassword   "fitly1612"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                          'proguard-rules.pro'
        }
    }

    // If you hit packaging issues with native libs, you can temporarily enable:
    // packagingOptions { jniLibs { useLegacyPackaging = true } }
}

flutter {
    source '../..'
}

dependencies {
    // Firebase (optional) — align versions with BoM
    implementation platform('com.google.firebase:firebase-bom:32.7.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-appcheck-playintegrity'
    implementation 'com.google.firebase:firebase-messaging'

    // Desugaring: >= 2.1.4 required; 2.1.5 is good
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
}
