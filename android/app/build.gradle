plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

android {
    namespace = "com.fitly.findptapp"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = "11"
    }

    defaultConfig {
        applicationId = "com.fitly.findptapp"
        minSdk = 23
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            storeFile     file("my_release.keystore")
            storePassword "fitly1612"
            keyAlias      "mykey"
            keyPassword   "fitly1612"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    // ❗️ DO NOT exclude SafetyNet manually — causes missing class error with Firebase App Check
    // Keep R8-compatible config in proguard-rules.pro instead
}

flutter {
    source = "../.."
}

dependencies {
    // 🔄 Use Firebase BOM to align dependency versions
    implementation platform('com.google.firebase:firebase-bom:32.7.0')

    // ✅ Firebase dependencies — versions handled by BOM
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-appcheck-playintegrity'
}
